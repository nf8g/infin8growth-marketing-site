<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&family=Instrument+Serif:ital@0;1&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      background: #0E2840;
      font-family: 'Instrument Sans', 'Century Gothic', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 80px;
      overflow: hidden;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .tag {
      background: #4A9B8E;
      color: white;
      font-size: 18px;
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .wordmark {
      color: white;
      font-size: 16px;
      letter-spacing: 6px;
      font-weight: 400;
      opacity: 0.7;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-right: 100px;
    }

    h1 {
      color: white;
      font-family: 'Instrument Serif', Georgia, serif;
      font-size: 64px;
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 24px;
    }

    h1 em {
      color: #FFB700;
      font-style: italic;
    }

    .subtitle {
      color: white;
      font-size: 24px;
      opacity: 0.8;
      line-height: 1.5;
      max-width: 800px;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .author {
      color: white;
      font-size: 18px;
      opacity: 0.6;
    }

    .url {
      color: #FFB700;
      font-size: 18px;
      font-weight: 600;
    }

    .accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: #FFB700;
    }
  </style>
</head>
<body>
  <div class="top">
    <span class="tag">Market Education</span>
    <span class="wordmark">I N F I N 8 &nbsp;&nbsp; G R O W T H</span>
  </div>

  <div class="content">
    <h1>Why focusing on your people<br>is the key to <em>success with AI</em></h1>
    <p class="subtitle">Your team's readiness is the real bottleneck. Here's how to introduce AI without losing the human element.</p>
  </div>

  <div class="bottom">
    <span class="author">By Marshall Tuten</span>
    <span class="url">infin8growth.ai</span>
  </div>

  <div class="accent-line"></div>
</body>
</html>
